function badge(id){return `<span class="pill ${pending(id)?task(id)?'blue':'red':'green'}">${status(id)}</span>`;}
const summary=id=>task(id)?.feedback||issue(id).impact;
function action(id){return `<button class="text-btn" onclick="openIssue('${id}')">${task(id)?'查看处理记录':'查看与交办'} →</button>`;}
function metrics(){const p=profile();return [
 {label:'本月经营收入',value:fmt(p.revenue),unit:p.moneyUnit,note:p.revenueTarget>0?`目标 ${fmt(p.revenueTarget)} ${p.moneyUnit} · 完成 ${pct(rate(p.revenue,p.revenueTarget))}`:'未设置月度目标',progress:rate(p.revenue,p.revenueTarget)},
 {label:p.operationsLabel,value:pct(rate(p.completed,p.total)).replace('%',''),unit:p.total>0?'%':'',note:p.total>0?`${p.operationsPeriod} ${fmt(p.completed)} / ${fmt(p.total)} ${p.operationsUnit}`:'业务目标待配置',progress:rate(p.completed,p.total)},
 {label:'应收回款率',value:pct(rate(p.collected,p.receivable)).replace('%',''),unit:p.receivable>0?'%':'',note:p.receivable>0?`已到账 ${fmt(p.collected)} / 应收 ${fmt(p.receivable)}`:'暂无应收记录',progress:rate(p.collected,p.receivable)},
 {label:'业务核查待办',value:issues().filter(x=>pending(x.id)).length,unit:'项',note:Object.values(businessState.tasks).filter(t=>t.status==='feedback').length+' 项等待决策复核',progress:null}
 ];}
function kpi(m,i){return `<article class="home-kpi"><div class="home-kpi-label">${esc(m.label)}</div><div class="home-kpi-value">${m.value}<small>${esc(m.unit)}</small></div><div class="home-kpi-note">${esc(m.note)}</div>${m.progress==null?'<div class="metric-placeholder"></div>':`<div class="home-meter ${i===1?'teal':i===2?'purple':'blue'}" role="meter" aria-label="${esc(m.label)}" aria-valuenow="${m.progress}" aria-valuemin="0" aria-valuemax="${Math.max(100,m.progress)}"><span style="width:${Math.min(100,m.progress)}%"></span></div>`}</article>`;}
function trend(){const p=profile(),data=p.trend;if(!data.length)return '<div class="chart-empty"><strong>历史记录待接入</strong><span>配置了当前指标后，仍需提供每日收入记录。</span></div>';const top=Math.max(1,Math.ceil(Math.max(...data)/4)*4),x=i=>42+i*(384/Math.max(1,data.length-1)),y=v=>130-v/top*110,points=data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<svg class="home-trend" viewBox="0 0 460 168" role="img" aria-label="${esc(p.company)}最近 ${data.length} 日经营收入，单位${esc(p.moneyUnit)}：${data.join('、')}"><defs><linearGradient id="income-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".18"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3,4].map(i=>`<line class="home-gridline" x1="36" x2="438" y1="${y(top*i/4)}" y2="${y(top*i/4)}"/><text x="1" y="${y(top*i/4)+4}">${fmt(top*i/4)}</text>`).join('')}<polygon points="42,130 ${points} ${x(data.length-1)},130" fill="url(#income-fill)"/><polyline points="${points}" class="home-trend-line"/>${data.map((v,i)=>`<circle class="home-trend-point" cx="${x(i)}" cy="${y(v)}" r="3.5"><title>10月${23-data.length+i}日：${fmt(v)} ${esc(p.moneyUnit)}</title></circle><text x="${x(i)}" y="155" text-anchor="middle">10.${23-data.length+i}</text>`).join('')}</svg>`;}
function progressChart(){const p=profile(),r=rate(p.completed,p.total),c=2*Math.PI*50;return `<div class="home-delivery-body"><svg class="home-donut" viewBox="0 0 144 144" role="img" aria-label="${esc(p.operationsLabel)}：${r==null?'未配置目标':pct(r)}"><circle class="home-donut-track" cx="72" cy="72" r="50"/>${r==null?'':`<circle class="home-donut-value" cx="72" cy="72" r="50" stroke-dasharray="${c*r/100} ${c}" transform="rotate(-90 72 72)"/>`}<text x="72" y="70" text-anchor="middle" class="home-donut-number">${r==null?'—':fmt(r)}<tspan>${r==null?'':'%'}</tspan></text><text x="72" y="91" text-anchor="middle" class="home-donut-caption">${r==null?'目标待配置':'完成比例'}</text></svg><div class="home-delivery-legend"><div><i class="home-dot teal"></i><span>已完成</span><strong>${fmt(p.completed)} <small>${esc(p.operationsUnit)}</small></strong></div><div><i class="home-dot muted"></i><span>未完成</span><strong>${fmt(p.total-p.completed)} <small>${esc(p.operationsUnit)}</small></strong></div></div></div>`;}
const groups=['业务运营','财务回款','管理决策','资料核验'];
function riskChart(){const max=3;return `<div class="home-risk-bars">${groups.map((g,i)=>{const n=issues().filter(x=>x.group===g&&pending(x.id)).length;return `<button class="home-risk-row" onclick="openGroup(${i})" aria-label="${g} ${n} 项待办"><span>${g}</span><span class="home-risk-track ${['blue','amber','purple','teal'][i]}"><i style="width:${n/max*100}%"></i></span><strong>${n}<small>项</small></strong></button>`;}).join('')}</div><div class="home-chart-caption">按未完成核查数量统计</div>`;}
function messages(){const p=profile();return [
 {id:'operations',time:'17:31',title:`${p.departments[0]}提交业务进度`,text:`${p.operationsLabel} ${pct(rate(p.completed,p.total))}，部门初稿与台账口径需核对。`,source:'validation'},
 {id:'cash',time:'17:33',title:`${p.departments[2]}更新回款记录`,text:`应收 ${fmt(p.receivable)} ${p.moneyUnit}，已到账 ${fmt(p.collected)} ${p.moneyUnit}。`,source:'cash'},
 {id:'decision',time:'17:35',title:p.decisionTitle,text:p.decisionImpact,source:'decision'}
 ];}
function feed(){return [...messages()].reverse().map(m=>`<button class="home-feed-row" onclick="openMessage('${m.id}')" aria-label="${esc(m.title)}，${businessState.read.includes(m.id)?'已读':'未读'}"><time>${m.time}</time><span><strong>${esc(m.title)}</strong><small>${esc(issue(m.id).department)}</small></span><i class="${businessState.read.includes(m.id)?'read':'unread'}"></i></button>`).join('');}
function todos(){const list=issues().filter(x=>pending(x.id)).slice(0,3);return list.length?list.map((x,i)=>`<button class="home-todo" onclick="openIssue('${x.id}')"><i class="home-todo-dot ${['blue','amber','purple'][i]}"></i><span class="home-todo-copy"><strong>${esc(x.title)}</strong><small>${esc(task(x.id)?.owner||x.owner)} · ${esc(x.department)}</small></span><span class="home-row-state">${status(x.id)}</span><span class="home-arrow">›</span></button>`).join(''):'<div class="home-no-todos"><strong>本轮业务核查均已复核</strong><p>实际经营结果仍需依据后续记录验证。</p><button class="text-btn" onclick="go(\'tasks\')">查看交办事项 →</button></div>';}
function overview(){const p=profile();return `<div class="home-dashboard"><div class="page-heading home-heading"><div><h1>经营总览</h1><div class="sub">${esc(p.company)} · ${esc(p.scope)} <span class="home-date">2026.10.22 · 17:35</span></div></div><div class="actions"><button onclick="openAssistant()">经营助理</button><button class="primary" onclick="openBriefing()">查看简报 ↗</button></div></div><section class="home-kpis">${metrics().map(kpi).join('')}</section><section class="home-analytics"><article class="card home-chart-card home-production"><div class="card-top"><div><h2>经营收入趋势</h2><span class="sub">${esc(p.moneyUnit)} / 日</span></div><button class="text-btn" onclick="sourceDocument('revenue')">查看数据 →</button></div>${trend()}</article><article class="card home-chart-card"><div class="card-top"><h2>${esc(p.operationsLabel)}</h2><button class="text-btn" onclick="openBusinessDetail()">详情 →</button></div>${progressChart()}<div class="home-chart-caption">${esc(p.operationsPeriod)} · 来源：${esc(p.sourceLabel)}</div></article><article class="card home-chart-card"><div class="card-top"><h2>待办分布</h2><button class="text-btn" onclick="showPending()">全部 →</button></div>${riskChart()}</article></section><section class="home-bottom"><article class="card home-list-card"><div class="card-top"><h2>重点待办</h2><button class="text-btn" onclick="showPending()">查看全部 ${issues().filter(x=>pending(x.id)).length} 项 →</button></div>${todos()}</article><article class="card home-list-card"><div class="card-top"><h2>最新部门汇报</h2><button class="text-btn" onclick="openNotifications()">汇报中心 →</button></div>${feed()}</article></section><div class="home-signals"><button onclick="openQuality()"><i class="home-dot ${verified('missing')?'teal':'amber'}"></i>资料完整性 <strong>${verified('missing')?'5 / 5':'4 / 5'} 部门已报</strong><span>›</span></button><button onclick="openIssue('validation')"><i class="home-dot ${verified('validation')?'teal':'blue'}"></i>业务口径 <strong>${verified('validation')?'已复核':p.draft===p.completed?'数值一致，口径待复核':`${fmt(Math.abs(p.draft-p.completed))} ${esc(p.operationsUnit)}差异待核实`}</strong><span>›</span></button><button onclick="openSettings()">${esc(p.label)} · 配置视图 ›</button></div></div>`;}
function heading(title,sub,actionHtml=''){return `<div class="page-heading"><div><h1>${title}</h1><div class="sub">${esc(profile().company)} · ${sub}</div></div><div class="actions">${actionHtml}</div></div>`;}
function alerts(){const rows=issues().filter(x=>alertFilter==='all'||(alertFilter==='open'?pending(x.id):!pending(x.id)));return heading('经营预警','业务影响、责任分工与核查状态','<button onclick="go(\'tasks\')">查看交办事项</button>')+`<section class="card"><div class="card-top"><h2>关注事项</h2><select aria-label="筛选预警状态" onchange="alertFilter=this.value;route()">${[['open','未完成'],['all','全部事项'],['closed','已复核']].map(([v,n])=>`<option value="${v}" ${alertFilter===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>事项</th><th>业务分类</th><th>责任部门</th><th>负责人</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.group}</td><td>${esc(x.department)}</td><td>${esc(task(x.id)?.owner||x.owner)}</td><td>${badge(x.id)}</td><td>${action(x.id)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':'<div class="empty-state">暂无符合条件的事项。</div>'}</section>`;}
function taskPage(){const rows=Object.entries(businessState.tasks).filter(([,t])=>taskFilter==='all'||t.status===taskFilter);return heading('交办事项','从责任分工到处理反馈，再到决策复核','<button onclick="showPending()">从预警交办</button>')+`<section class="card"><div class="card-top"><h2>处理记录</h2><select aria-label="筛选任务状态" onchange="taskFilter=this.value;route()">${[['all','全部状态'],['assigned','核查中'],['feedback','待决策复核'],['closed','已复核']].map(([v,n])=>`<option value="${v}" ${taskFilter===v?'selected':''}>${n}</option>`).join('')}</select></div>${rows.length?rows.map(([id,t])=>`<div class="task-row"><div><h3>${esc(issue(id).title)}</h3><div class="sub">${esc(t.owner)} · 截止 ${esc(t.due.replace('T',' '))} · ${badge(id)}</div></div><button onclick="taskRecord('${id}')">查看进展 →</button></div>`).join(''):'<div class="empty-state"><h3>暂无符合条件的交办事项</h3><p class="sub">从首页或经营预警中选择事项，并明确负责人和截止时间。</p><button onclick="showPending()">查看经营预警</button></div>'}</section>`;}
function departments(){const p=profile(),descriptions=[`${p.operationsLabel} ${pct(rate(p.completed,p.total))}`,`本月经营收入 ${fmt(p.revenue)} ${p.moneyUnit}`,`已到账 ${fmt(p.collected)} ${p.moneyUnit}，逾期未收 ${fmt(p.overdue)} ${p.moneyUnit}`,'业务进度与客户承诺持续跟踪',p.decisionTitle];return heading('部门汇报','指标有口径，信息有来源，事项有负责人')+`<div class="department-grid">${p.departments.map((name,i)=>`<section class="card"><div class="card-top"><h2>${esc(name)}</h2><span class="pill ${i===2&&!verified('missing')?'red':'blue'}">${i===2&&!verified('missing')?'日报待补交':'资料已收集'}</span></div><div class="department-owner"><span class="avatar">${esc(p.owners[i][0])}</span><div>${esc(p.owners[i])}<div class="sub">部门负责人</div></div></div><p>${esc(descriptions[i])}</p><button class="text-btn" onclick="sourceDocument('${['operations','revenue','cash','freshness','decision'][i]}')">查看汇报与来源 →</button></section>`).join('')}</div>`;}
function reports(){return heading('经营简报','2026年10月22日 · 按当前行业口径汇总','<button onclick="exportBriefing()">导出简报</button>')+`<section class="card report-body">${briefingHtml()}</section>`;}
function briefingHtml(){const p=profile();return `<h2>${esc(p.company)} · 今日经营简报</h2><div class="detail-block">本月经营收入 ${fmt(p.revenue)} ${esc(p.moneyUnit)}；${esc(p.operationsLabel)} ${pct(rate(p.completed,p.total))}；应收回款率 ${pct(rate(p.collected,p.receivable))}。</div>${issues().slice(0,3).map(x=>`<h3>${esc(x.title)}</h3><p>${badge(x.id)}</p><p>${esc(summary(x.id))}</p>${action(x.id)}`).join('')}<h3>信息核验</h3><p>${verified('missing')?'部门日报补交依据已复核。':'部门日报缺失，未基于缺失资料生成结论。'}${verified('validation')?'业务口径已复核，核验记录留档。':p.draft===p.completed?'初稿与台账数值一致，统计口径仍待复核。':'部门初稿与原始台账不一致，首页采用原始台账值。'}</p>`;}
function route(){const modes={overview:['经营总览',overview],alerts:['经营预警',alerts],departments:['部门汇报',departments],reports:['经营简报',reports],tasks:['交办事项',taskPage]},key=location.hash.slice(1)||'overview',mode=modes[key]?key:'overview';$('#main').innerHTML=modes[mode][1]();$('#breadcrumb').textContent=modes[mode][0];document.querySelectorAll('[data-nav]').forEach(n=>{n.classList.toggle('active',n.dataset.nav===mode);if(n.dataset.nav===mode)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});$('#workspace-name').innerHTML=esc(profile().company)+'<small>'+esc(profile().scope)+'</small>';$('#workspace-icon').textContent=profile().company[0];const unread=messages().filter(m=>!businessState.read.includes(m.id)).length;$('#unread-count').textContent=unread;$('#notifications').setAttribute('aria-label',`消息通知，${unread} 条未读`);$('#industry-select').innerHTML=Object.entries(profiles).map(([id,p])=>`<option value="${id}" ${id===profileId?'selected':''}>${esc(p.label)}</option>`).join('');}
function go(mode){$('#detail').close();if(location.hash!=='#'+mode)location.hash=mode;route();window.scrollTo?.(0,0);}
function showPending(){alertFilter='open';go('alerts')}
function switchIndustry(id){if(!Object.hasOwn(profiles,id))return;profileId=id;if(typeof trendWindow!=='undefined'){trendWindow=7;trendSelection=null;}businessState=readState();chat=[];chatTopic='overview';alertFilter='open';taskFilter='all';save('xz-universal-selected',id);$('#detail').close();route();toast('已切换至'+profile().label+'视图');}
function openIssue(id){const x=issue(id);if(!x)return;modal(`<span class="pill blue">${x.group}</span><h2>${esc(x.title)}</h2><dl class="detail-list"><dt>影响范围</dt><dd>${esc(x.impact)}</dd><dt>责任部门</dt><dd>${esc(x.department)}</dd><dt>负责人</dt><dd>${esc(task(id)?.owner||x.owner)}</dd><dt>处理状态</dt><dd>${badge(id)}</dd></dl>${task(id)?.feedback?`<div class="detail-block">${esc(task(id).feedback)}</div>`:''}<div class="actions"><button onclick="sourceDocument('${x.source}')">查看原始依据</button><button class="primary" onclick="${task(id)?'taskRecord':'assign'}('${id}')">${task(id)?'查看处理记录':'交办负责人'}</button></div>`);}
function openGroup(index){const g=groups[index];if(!g)return;modal(`<span class="pill blue">事项分布</span><h2>${g}</h2>${issues().filter(x=>x.group===g).map(x=>`<div class="quality-item"><div><h3>${esc(x.title)}</h3>${badge(x.id)}<p class="sub">${esc(summary(x.id))}</p></div>${action(x.id)}</div>`).join('')}`);}
function openQuality(){modal(`<span class="pill blue">信息完整性</span><h2>部门上报与资料核验</h2>${issues().filter(x=>x.type==='evidence').map(x=>`<div class="quality-item"><div><h3>${esc(x.title)}</h3>${badge(x.id)}<p class="sub">${esc(summary(x.id))}</p></div>${action(x.id)}</div>`).join('')}`);}
function openBusinessDetail(){const p=profile();modal(`<span class="pill blue">业务进展</span><h2>${esc(p.operationsLabel)}</h2><div class="detail-block">完成 ${fmt(p.completed)} / 总量 ${fmt(p.total)} ${esc(p.operationsUnit)}，完成比例 ${pct(rate(p.completed,p.total))}。</div><p>当前关注：${esc(p.operationImpact)}</p><div class="actions"><button onclick="sourceDocument('operations')">查看业务台账</button><button onclick="openIssue('operations')">跟进业务事项</button></div>`);}

function openNotifications(){modal(`<span class="pill blue">${esc(profile().company)}</span><h2>部门汇报中心</h2>${feed()}<button onclick="markAllRead()">全部标为已读</button>`);}
function markAllRead(){businessState.read=messages().map(m=>m.id);persist();route();openNotifications();}
function sourceDocument(key){const p=profile(),docs={
 revenue:{title:'经营收入统计',id:`${p.id.toUpperCase()}-REV-1022`,rows:[['本月收入',`${fmt(p.revenue)} ${p.moneyUnit}`],['月度目标',p.revenueTarget?`${fmt(p.revenueTarget)} ${p.moneyUnit}`:'未配置'],['统计范围','2026-10-01 至 2026-10-22'],...p.trend.map((v,i)=>[`${typeof trendDate==='function'?trendDate(i):'10.'+(23-p.trend.length+i)} 收入`,`${fmt(v)} ${p.moneyUnit}`])],note:p.trend.length?'最近数日收入是月度收入的一部分，不与月度累计直接相等。':'没有提供每日历史记录，趋势图显示待接入。'},
 operations:{title:p.sourceLabel,id:issue('operations').sourceId,rows:[['指标名称',p.operationsLabel],['已完成',`${fmt(p.completed)} ${p.operationsUnit}`],['目标或总量',`${fmt(p.total)} ${p.operationsUnit}`],['完成率',pct(rate(p.completed,p.total))],['统计周期',p.operationsPeriod+'，截至 2026-10-22']],note:'完成率由完成数与总量计算；交办与复核不改写原始指标。'},
 cash:{title:'应收与银行到账核对记录',id:issue('cash').sourceId,rows:[['应收合计',`${fmt(p.receivable)} ${p.moneyUnit}`],['已到账',`${fmt(p.collected)} ${p.moneyUnit}`],['尚未到账',`${fmt(p.receivable-p.collected)} ${p.moneyUnit}`],['其中逾期未收',`${fmt(p.overdue)} ${p.moneyUnit}`],['未到期未收',`${fmt(p.receivable-p.collected-p.overdue)} ${p.moneyUnit}`]],note:'应收回款率不等于收入完成率；未到账款项中仅已超过约定日期的部分列为逾期。'},
 decision:{title:p.decisionTitle,id:issue('decision').sourceId,rows:[['方案负责人',p.owners[4]],['牵头部门',p.departments[4]],['待确认事项',p.decisionImpact],['当前决策',task('decision')?.status==='closed'?'方案已确认，执行结果待跟踪':'等待经营负责人确认']],note:task('decision')?.decisionNote||'方案汇总、负责人复核与实际执行分别记录。'},

function saveSettings(){const get=id=>$('#'+id).value.trim(),numbers={revenue:'view-revenue',revenueTarget:'view-revenue-target',completed:'view-completed',draft:'view-draft',total:'view-total',receivable:'view-receivable',collected:'view-collected',overdue:'view-overdue'},p={};for(const [k,id] of Object.entries(numbers)){const raw=get(id),n=Number(raw);if(raw===''||!Number.isFinite(n)||n<0||n>1e9)return error(id,'请填写 0 至 10 亿范围内的有效数字。');p[k]=n;}if(p.completed>p.total)return error('view-completed','完成数量不能大于业务目标或总量。');if(p.collected>p.receivable)return error('view-collected','已到账金额不能大于应收合计。');if(p.overdue>p.receivable-p.collected+1e-8)return error('view-overdue','逾期未收不能大于尚未到账金额。');for(const id of ['view-label','view-company','view-scope'])if(!get(id))return error(id,'请填写完整名称。');const departments=Array.from({length:5},(_,i)=>get('view-dept-'+i)),owners=Array.from({length:5},(_,i)=>get('view-owner-'+i));for(let i=0;i<5;i++){if(!departments[i])return error('view-dept-'+i,'请填写责任部门。');if(!owners[i])return error('view-owner-'+i,'请填写负责人。');}if(!get('view-ops-label'))return error('view-ops-label','请填写业务指标名称。');if(!get('view-ops-unit'))return error('view-ops-unit','请填写数量单位。');const candidate={...INDUSTRY_PROFILES.general,...p,id:'custom',revision:String(Math.max(Date.now(),Number(profiles.custom?.revision||0)+1)),label:get('view-label'),company:get('view-company'),scope:get('view-scope'),moneyUnit:get('view-unit'),operationsLabel:get('view-ops-label'),operationsPeriod:get('view-ops-period'),operationsUnit:get('view-ops-unit'),trend:[],departments,owners,operationTitle:get('view-operation-title')||INDUSTRY_PROFILES.general.operationTitle,operationImpact:get('view-operation-impact')||INDUSTRY_PROFILES.general.operationImpact,operationRequest:get('view-operation-request')||INDUSTRY_PROFILES.general.operationRequest,decisionTitle:get('view-decision-title')||INDUSTRY_PROFILES.general.decisionTitle,decisionImpact:get('view-decision-impact')||INDUSTRY_PROFILES.general.decisionImpact,sourceLabel:get('view-source-label')||INDUSTRY_PROFILES.general.sourceLabel};if(!validProfile(candidate))return error('view-label','配置未通过检查，请核对名称长度与数据范围。');profiles.custom=candidate;save('xz-universal-custom',candidate);switchIndustry('custom');}

</script><script>/* Product refresh: contextual analysis, compact bento layout and keyboard search. */
let trendWindow=7,trendSelection=null;
const uiIcon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${({search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',spark:'<path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',report:'<path d="M7 3h7l4 4v14H6V3zm7 0v5h5M9 12h6m-6 4h6"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'})[name]||''}</svg>`;
function trendDate(index){const date=new Date(businessDay+'T00:00:00Z');date.setUTCDate(date.getUTCDate()-(profile().trend.length-1-index));return `${date.getUTCMonth()+1}.${String(date.getUTCDate()).padStart(2,'0')}`;}
function visibleTrend(){const values=profile().trend;return values.map((value,index)=>({value,index})).slice(-trendWindow);}
function selectedTrend(){const p=profile();if(!p.trend.length)return null;const visible=visibleTrend();return visible.find(d=>d.index===trendSelection)||visible.at(-1);}
function trendReadout(){const p=profile(),point=selectedTrend();if(!point)return '';const previous=p.trend[point.index-1],delta=previous>0?rate(point.value-previous,previous):null;return `<div><span>${trendDate(point.index)} 单日收入</span><strong>${fmt(point.value)} <small>${esc(p.moneyUnit)}</small></strong></div><span class="trend-change">${previous==null?'首个记录日':delta==null?'前日为零，不计算增幅':`较前日 ${delta>0?'+':''}${pct(delta)}`}</span><button class="text-btn" onclick="openTrendDetail()">查看当日记录 ${uiIcon('arrow')}</button>`;}
function trend(){const p=profile(),data=visibleTrend(),selected=selectedTrend();if(!data.length)return '<div class="chart-empty"><strong>历史记录待接入</strong><span>配置了当前指标后，仍需提供每日收入记录。</span><button class="text-btn" onclick="sourceDocument(\'revenue\')">查看当前收入统计 →</button></div>';const top=Math.max(1,Math.ceil(Math.max(...data.map(d=>d.value))/4)*4),x=i=>44+i*(576/Math.max(1,data.length-1)),y=v=>146-v/top*124,average=data.reduce((s,d)=>s+d.value,0)/data.length,points=data.map((d,i)=>`${x(i)},${y(d.value)}`).join(' ');return `<div class="trend-plot"><div class="trend-y-labels" aria-hidden="true">${[0,1,2,3,4].map(i=>`<span style="top:${y(top*i/4)/162*100}%">${fmt(top*i/4)}</span>`).join('')}</div><svg class="home-trend" preserveAspectRatio="none" viewBox="0 0 656 162" role="img" aria-label="${esc(p.company)}最近 ${data.length} 日经营收入，单位${esc(p.moneyUnit)}：${data.map(d=>d.value).join('、')}"><defs><linearGradient id="income-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity=".015"/></linearGradient></defs>${[0,1,2,3,4].map(i=>`<line class="home-gridline" x1="44" x2="630" y1="${y(top*i/4)}" y2="${y(top*i/4)}"/>`).join('')}<polygon points="44,146 ${points} ${x(data.length-1)},146" fill="url(#income-fill)"/><line class="trend-average" x1="44" x2="630" y1="${y(average)}" y2="${y(average)}"/><polyline points="${points}" class="home-trend-line"/>${data.map((d,i)=>`<circle class="home-trend-point ${selected.index===d.index?'selected':''}" data-trend-point="${d.index}" cx="${x(i)}" cy="${y(d.value)}" r="${selected.index===d.index?5:3}"/><circle cx="${x(i)}" cy="${y(d.value)}" r="16" fill="transparent" stroke="none" onclick="selectTrendPoint(${d.index})"><title>${trendDate(d.index)}：${fmt(d.value)} ${esc(p.moneyUnit)}</title></circle>`).join('')}</svg></div><div class="trend-days">${data.map((d,i)=>`<button style="left:${x(i)/656*100}%" class="trend-day ${selected.index===d.index?'selected':''}" data-trend-day="${d.index}" aria-pressed="${selected.index===d.index}" aria-label="查看 ${trendDate(d.index)} 收入 ${fmt(d.value)} ${esc(p.moneyUnit)}" onclick="selectTrendPoint(${d.index})">${trendDate(d.index)}</button>`).join('')}</div><div id="trend-readout" class="trend-readout" aria-live="polite">${trendReadout()}</div>`;}
function selectTrendPoint(index){if(!visibleTrend().some(d=>d.index===index))return;trendSelection=index;$('#trend-readout').innerHTML=trendReadout();document.querySelectorAll('[data-trend-day]').forEach(n=>{const active=Number(n.dataset.trendDay)===index;n.classList.toggle('selected',active);n.setAttribute('aria-pressed',String(active));});document.querySelectorAll('[data-trend-point]').forEach(n=>{const active=Number(n.dataset.trendPoint)===index;n.classList.toggle('selected',active);n.setAttribute('r',active?'5':'3');});}
function setTrendWindow(days){if(![3,7].includes(days))return;trendWindow=days;trendSelection=null;$('#revenue-visual').innerHTML=trend();document.querySelectorAll('[data-trend-window]').forEach(n=>n.setAttribute('aria-pressed',String(Number(n.dataset.trendWindow)===days)));$('#trend-average-label').textContent=trendAverageLabel();}
function trendAverageLabel(){const data=visibleTrend();return data.length?`区间均值 ${fmt(data.reduce((s,d)=>s+d.value,0)/data.length)} ${profile().moneyUnit}`:'每日收入记录待接入';}
function openTrendDetail(){const d=selectedTrend();if(!d)return;const p=profile();modal(`<span class="pill blue">单日收入记录</span><h2>${trendDate(d.index)} · 经营收入</h2><dl class="detail-list"><dt>企业范围</dt><dd>${esc(p.company)} · ${esc(p.scope)}</dd><dt>当日收入</dt><dd>${fmt(d.value)} ${esc(p.moneyUnit)}</dd><dt>来源编号</dt><dd>${esc(p.id.toUpperCase())}-REV-1022</dd><dt>统计口径</dt><dd>收入统计中的每日汇总，不代表银行实际到账。</dd></dl><div class="actions"><button onclick="sourceDocument('revenue')">查看完整收入统计</button><button class="primary" onclick="askFromContext('revenue')">追问经营助理</button></div>`);}
function askFromContext(topic){openAssistant();ask(topic==='revenue'?'收入情况怎么样？':topic==='cash'?'回款情况如何？':profile().operationsLabel+'怎么样？');}
function kpi(m,i){return `<article class="home-kpi"><div class="home-kpi-label">${esc(m.label)}<button class="kpi-open" onclick="${['sourceDocument(\'revenue\')','openBusinessDetail()','sourceDocument(\'cash\')','showPending()'][i]}" aria-label="查看${esc(m.label)}详情">↗</button></div><div class="home-kpi-value${String(m.value).length>9?' is-long':String(m.value).length>6?' is-medium':''}">${m.value}<small>${esc(m.unit)}</small></div><div class="home-kpi-note">${esc(m.note)}</div>${m.progress==null?'<div class="metric-placeholder"></div>':`<div class="home-meter ${i===1?'teal':i===2?'purple':'blue'}" role="meter" aria-label="${esc(m.label)}" aria-valuenow="${m.progress}" aria-valuemin="0" aria-valuemax="${Math.max(100,m.progress)}"><span style="width:${Math.min(100,m.progress)}%"></span></div>`}</article>`;}
function cashChart(){const p=profile(),parts=[p.collected,Math.max(0,p.receivable-p.collected-p.overdue),p.overdue],labels=['已到账','未到期','已逾期'];return `<div class="cash-visual"><div class="cash-total"><span>尚未到账</span><strong>${fmt(p.receivable-p.collected)} <small>${esc(p.moneyUnit)}</small></strong><button class="text-btn" onclick="openIssue('cash')">${p.overdue>0?`逾期 ${fmt(p.overdue)} ${esc(p.moneyUnit)} · ${pending('cash')?'待核查':'查看复核'}`:'查看回款核查'} ›</button></div><div class="cash-breakdown"><div class="cash-stack" role="img" aria-label="${parts.map((v,i)=>labels[i]+fmt(v)+p.moneyUnit).join('，')}">${parts.map((v,i)=>`<span class="cash-part part-${i}" style="width:${p.receivable? v/p.receivable*100:0}%"></span>`).join('')}</div><div class="cash-legend">${parts.map((v,i)=>`<span><i class="cash-swatch part-${i}"></i>${labels[i]} <strong>${fmt(v)}</strong></span>`).join('')}</div></div></div>`;}
function insightLine(){const p=profile(),gap=p.revenueTarget-p.revenue;return `<div class="insight-label">${uiIcon('spark')}经营摘要</div><p>${p.revenueTarget>0?gap>0?`本月收入距目标还有 <strong>${fmt(gap)} ${esc(p.moneyUnit)}</strong>`:`本月收入已达到目标 <strong>${pct(rate(p.revenue,p.revenueTarget))}</strong>`:'月度收入目标待配置'}${p.overdue>0?`；<button onclick="openIssue('cash')">${fmt(p.overdue)} ${esc(p.moneyUnit)}逾期回款</button>需关注。`:'；暂无逾期未收记录。'}</p><button class="insight-source" onclick="sourceDocument('overview')" aria-label="查看经营摘要依据">查看依据 ${uiIcon('arrow')}</button>`;}
function overview(){const p=profile();return `<div class="home-dashboard"><div class="page-heading home-heading"><div><div class="page-kicker">经营管理 / OVERVIEW</div><h1>经营总览</h1><div class="sub">${esc(p.company)} <span class="heading-separator">/</span> ${esc(p.scope)}</div></div><div class="actions"><span class="snapshot-date">${uiIcon('clock')}业务日期 2026.10.22</span><button onclick="openBriefing()">${uiIcon('report')}经营简报</button><button class="primary" onclick="openAssistant()">${uiIcon('spark')}经营助理</button></div></div><section class="home-kpis" aria-label="关键经营指标">${metrics().map(kpi).join('')}</section><section class="home-analytics" aria-label="经营分析"><article class="card home-chart-card home-production"><div class="card-top"><div><h2>经营收入趋势</h2><span class="sub">${esc(p.moneyUnit)} / 日 <span class="chart-legend-mark"></span><span id="trend-average-label">${esc(trendAverageLabel())}</span></span></div><div class="trend-range" role="group" aria-label="收入趋势展示区间"><button data-trend-window="7" aria-pressed="${trendWindow===7}" onclick="setTrendWindow(7)">近7日</button><button data-trend-window="3" aria-pressed="${trendWindow===3}" onclick="setTrendWindow(3)">近3日</button></div></div><div id="revenue-visual">${trend()}</div><div class="insight-strip">${insightLine()}</div></article><article class="card home-chart-card home-goal"><div class="card-top"><h2>${esc(p.operationsLabel)}</h2><button class="text-btn" onclick="openBusinessDetail()">查看详情 ↗</button></div>${progressChart()}<div class="mini-foot">${esc(p.operationsPeriod)} · ${esc(p.sourceLabel)}</div></article><article class="card home-chart-card home-cash"><div class="card-top"><h2>应收款结构</h2><button class="text-btn" onclick="sourceDocument('cash')">查看明细 ↗</button></div>${cashChart()}</article></section><section class="home-bottom"><article class="card home-list-card"><div class="card-top"><h2>重点待办 <span class="count-label">${issues().filter(x=>pending(x.id)).length} 项</span></h2><button class="text-btn" onclick="showPending()">查看全部 ${issues().filter(x=>pending(x.id)).length} 项 →</button></div>${todos()}</article><article class="card home-list-card"><div class="card-top"><h2>最新部门汇报</h2><button class="text-btn" onclick="openNotifications()">汇报中心 →</button></div>${feed()}</article></section><div class="home-signals"><button onclick="openQuality()"><i class="home-dot ${verified('missing')?'teal':'amber'}"></i>资料完整性 <strong>${verified('missing')?'5 / 5':'4 / 5'} 部门已报</strong><span>›</span></button><button onclick="openIssue('validation')"><i class="home-dot ${verified('validation')?'teal':'blue'}"></i>业务口径 <strong>${verified('validation')?'已复核':p.draft===p.completed?'数值一致，口径待复核':`${fmt(Math.abs(p.draft-p.completed))} ${esc(p.operationsUnit)}差异待核实`}</strong><span>›</span></button><button onclick="openDistribution()">查看待办分布 ↗</button><span class="snapshot-foot">资料检查于 17:35</span></div></div>`;}
function openDistribution(){modal(`<span class="pill blue">待办分布</span><h2>按业务分类查看</h2>${riskChart()}<p class="sub">仅统计尚未完成复核的事项，点击分类查看相关记录。</p>`);}
function openGroup(index){const g=groups[index];if(!g)return;const rows=issues().filter(x=>x.group===g&&pending(x.id));modal(`<span class="pill blue">未完成事项</span><h2>${g}</h2>${rows.length?rows.map(x=>`<div class="quality-item"><div><h3>${esc(x.title)}</h3>${badge(x.id)}<p class="sub">${esc(summary(x.id))}</p></div>${action(x.id)}</div>`).join(''):'<div class="empty-state">此分类暂无待办事项。</div>'}`);}
function commandItems(query=''){const p=profile(),q=String(query).trim().slice(0,100).toLocaleLowerCase();const items=[{kind:'page',id:'overview',title:'经营总览',meta:'页面 · 经营指标与趋势'},{kind:'page',id:'alerts',title:'经营预警',meta:'页面 · 查看与交办事项'},{kind:'page',id:'departments',title:'部门汇报',meta:'页面 · 责任部门与业务资料'},{kind:'page',id:'reports',title:'经营简报',meta:'页面 · 阅读与导出'},{kind:'page',id:'tasks',title:'交办事项',meta:'页面 · 反馈与复核'},...issues().map(x=>({kind:'issue',id:x.id,title:x.title,meta:`${x.department} · ${task(x.id)?.owner||x.owner} · ${status(x.id)}`})),{kind:'source',id:'revenue',title:'经营收入统计',meta:`业务记录 · ${p.company}`},{kind:'source',id:'cash',title:'应收与到账记录',meta:'业务记录 · 回款与逾期'},{kind:'settings',id:'settings',title:'配置行业视图',meta:'设置 · 企业、指标与责任人'},{kind:'assistant',id:'assistant',title:'经营助理',meta:'问询 · 经营问题与依据'}];return items.filter(x=>!q||(x.title+' '+x.meta).toLocaleLowerCase().includes(q));}

const liquidState={position:0,velocity:0,target:0,cross:0,horizontal:false,initialized:false,frame:0,last:0};
function paintLiquid(){
 const stretch=Math.min(.19,Math.abs(liquidState.velocity)*.00026),direction=liquidState.horizontal;
 liquidHighlight.style.transform=`translate3d(${direction?liquidState.position:liquidState.cross}px,${direction?liquidState.cross:liquidState.position}px,0) scale(${direction?1+stretch:1-stretch*.48},${direction?1-stretch*.48:1+stretch})`;
}
function stepLiquid(now){
 const delta=Math.min((now-liquidState.last)/1000||.016,.032);liquidState.last=now;
 const steps=3,interval=delta/steps;
 for(let step=0;step<steps;step++){const acceleration=(260*(liquidState.target-liquidState.position)-24*liquidState.velocity)/1.15;liquidState.velocity+=acceleration*interval;liquidState.position+=liquidState.velocity*interval;}
 if(Math.abs(liquidState.position-liquidState.target)<.08&&Math.abs(liquidState.velocity)<.15){liquidState.position=liquidState.target;liquidState.velocity=0;liquidState.frame=0;paintLiquid();return;}

}

 const horizontal=matchMedia('(max-width:700px)').matches,axisChanged=horizontal!==liquidState.horizontal;

 liquidHighlight.style.width=selected.offsetWidth+'px';liquidHighlight.style.height=selected.offsetHeight+'px';
 if(!liquidState.initialized||axisChanged||cinemaReduceMotion()){cancelAnimationFrame(liquidState.frame);liquidState.frame=0;liquidState.position=liquidState.target;liquidState.velocity=0;liquidState.initialized=true;paintLiquid();return;}

 function paint(){frame=0;if(!point||!bounds)return;const horizontal=Math.max(0,Math.min(1,(point.x-bounds.left)/bounds.width)),vertical=Math.max(0,Math.min(1,(point.y-bounds.top)/bounds.height));for(const layer of [glow,edge]){layer.style.setProperty('--glow-x',horizontal*100+'%');layer.style.setProperty('--glow-y',vertical*100+'%');}const tiltRange=bounds.width>350||bounds.height>230?.45:.8;card.style.setProperty('--tilt-x',(0.5-vertical)*tiltRange+'deg');card.style.setProperty('--tilt-y',(horizontal-.5)*tiltRange+'deg');}

function deliveryVerificationMarkup(){return '<ul><li>'+(verified('stale')?'业务进度的更新依据已复核，原始快照继续保留。':'业务进度更新于 16:10，距资料检查时点 17:35 已超过 60 分钟，需核实。')+'</li><li>'+(verified('missing')?'缺失的部门日报已补交，补交依据已复核。':'仍有部门日报未交齐，只根据已收到的资料作汇总。')+'</li><li>'+(verified('validation')?'业务统计口径已复核，核验依据可追溯。':profile().draft===profile().completed?'初稿和台账数字一致，统计口径仍待核实。':'初稿和台账数字存在差异，本汇总采用原始台账，差异原因待核实。')+'</li>'+(profileId==='manufacturing'?'<li>生产差额 14 台、两笔示例订单待交付共 14 台；仍需核实库存和补产安排，不能据此直接认定延期。</li>':'')+'</ul>';}

<script>
// Goals describe business outcomes; the right-hand cards describe work awaiting action.
function goalRingMetrics(){const p=profile();return [
 {label:'收入目标达成',value:rate(p.revenue,p.revenueTarget),detail:fmt(p.revenue)+' / '+(p.revenueTarget>0?fmt(p.revenueTarget):'未配置')+' '+p.moneyUnit,color:'#e49541',source:'revenue'},
 {label:p.operationsLabel,value:rate(p.completed,p.total),detail:fmt(p.completed)+' / '+fmt(p.total)+' '+p.operationsUnit,color:'#248e82',source:'operations'},
 {label:'应收回款率',value:rate(p.collected,p.receivable),detail:fmt(p.collected)+' / '+fmt(p.receivable)+' '+p.moneyUnit,color:'#7b9271',source:'cash'}];}
function openGoalMetric(index){const metric=goalRingMetrics()[index];if(!metric)return;if(index===1)openBusinessDetail();else sourceDocument(metric.source);}
function workQueueItems(kind){return issues().filter(item=>kind==='unassigned'?!task(item.id):task(item.id)?.status===kind);}
function openWorkQueue(kind){const label={unassigned:'待交办',assigned:'跟进中',feedback:'待复核'}[kind];if(!label)return;const entries=workQueueItems(kind);modal('<span class="pill blue">事项处理</span><h2>'+label+' · '+entries.length+' 项</h2><p class="sub">'+({unassigned:'尚未明确负责人和截止时间的事项。',assigned:'已交办，等待负责人提交处理反馈。',feedback:'负责人已提交反馈，等待你审阅并复核。'}[kind])+'</p>'+entries.map(item=>'<div class="task-row"><div><h3>'+esc(item.title)+'</h3><div class="sub">'+esc(task(item.id)?.owner||item.owner)+' · '+esc(item.department)+'</div></div><button onclick="'+(kind==='unassigned'?'openIssue':'taskRecord')+'(&#39;'+item.id+'&#39;)">'+(kind==='unassigned'?'查看与交办':kind==='feedback'?'审阅反馈':'查看进展')+' →</button></div>').join('')+(entries.length?'':'<div class="queue-empty">当前没有'+label+'事项。</div>'));}
const ringsOverviewBase=overview;
overview=function(){
 const template=document.createElement('template');template.innerHTML=ringsOverviewBase();
 const hero=template.content.querySelector('.cinema-hero');if(!hero)return template.innerHTML;
 const p=profile(),items=goalRingMetrics(),gap=Math.max(0,p.revenueTarget-p.revenue);
 const percent=value=>value==null?'—':fmt(value)+'%';
 hero.innerHTML='<div class="goal-heading"><div class="cinema-kicker">BUSINESS PERFORMANCE / 本月经营</div><p>'+esc(p.company)+' · '+esc(p.scope)+'</p></div><div class="goal-orbit"><svg viewBox="0 0 300 300" aria-label="三项经营指标进度">'+items.map((item,index)=>'<g transform="rotate(-90 150 150)"><circle class="goal-ring-track" cx="150" cy="150" r="'+(126-index*25)+'"/><circle class="goal-ring-value" cx="150" cy="150" r="'+(126-index*25)+'" pathLength="100" style="--ring-color:'+item.color+';stroke-dashoffset:'+(100-Math.max(0,Math.min(100,item.value??0)))+';'+(item.value===0||item.value==null?'visibility:hidden;':'')+'" data-ring-index="'+index+'" tabindex="0" role="button" aria-label="'+esc(item.label)+' '+percent(item.value)+'，查看详情" onclick="openGoalMetric('+index+')"/></g>').join('')+'</svg><button class="goal-center" onclick="openGoalMetric(Number(this.dataset.index||0))" aria-label="查看当前指标详情"><strong data-goal-center-value>'+percent(items[0].value)+'</strong><span data-goal-center-label>'+esc(items[0].label)+'</span></button></div><div class="goal-legend">'+items.map((item,index)=>'<button style="--ring-color:'+item.color+'" data-ring-index="'+index+'" onclick="openGoalMetric('+index+')"><i></i><span><strong>'+esc(item.label)+'</strong><small>'+esc(item.detail)+'</small></span><b>'+percent(item.value)+'</b></button>').join('')+'</div><div class="goal-gap">'+(p.revenueTarget>0?(gap>0?'距月度收入目标还差 <strong>'+fmt(gap)+'</strong> '+esc(p.moneyUnit):'本月收入已达到目标，继续关注业务进度与回款。'):'尚未配置月度收入目标。')+'<div class="sub">业务日期 2026.10.22 · 示例经营数据</div></div><button class="goal-source" onclick="sourceDocument(&#39;overview&#39;)">查看目标与原始依据 <span>↗</span></button>';
 const quality=template.content.querySelector('.cinema-attention'),checks=issues().filter(item=>item.type==='evidence'&&!verified(item.id));
 if(quality)quality.innerHTML='<div class="card-top"><h2>资料待核验</h2><button class="text-btn" onclick="openQuality()">核验 ↗</button></div><div class="attention-main"><div class="attention-number">'+checks.length+'<small>项资料检查</small></div><div class="attention-dots" aria-hidden="true">'+Array.from({length:12},(_,index)=>'<i class="'+(index<checks.length?'on':'')+'"></i>').join('')+'</div></div><div class="attention-copy">'+(checks.length?'检查资料缺失、更新时间与统计口径':'资料核验已完成，原始依据可追溯')+'</div>';
 const queue=[['unassigned','待交办','明确责任人与截止时间','#a75b1e'],['assigned','跟进中','等待负责人提交反馈','#248e82'],['feedback','待复核','已收反馈，等待你确认','#796b9b']];
 template.content.querySelectorAll('.cinema-metric').forEach((card,index)=>{const [kind,label,note,color]=queue[index];card.classList.add('workload-metric');card.style.setProperty('--queue-color',color);card.innerHTML='<div class="metric-name"><span><i class="workload-mark"></i>'+label+'</span><button onclick="openWorkQueue(&#39;'+kind+'&#39;)" aria-label="查看'+label+'事项">↗</button></div><div class="metric-figure">'+workQueueItems(kind).length+'<small>项</small></div><div class="metric-foot">'+note+'</div>';});
 return template.innerHTML;
};
let goalCenterFrame=0;
function highlightGoalRing(index){const orbit=document.querySelector('.goal-orbit');if(!orbit)return;cancelAnimationFrame(goalCenterFrame);const active=index==null?0:Number(index),metric=goalRingMetrics()[active];if(index==null)delete orbit.dataset.active;else orbit.dataset.active=String(active);orbit.querySelector('[data-goal-center-value]').innerHTML=metric.value==null?'—':fmt(metric.value)+'<small>%</small>';orbit.querySelector('[data-goal-center-label]').textContent=metric.label;orbit.querySelector('.goal-center').dataset.index=String(active);}
const enteredGoalSignatures=new Set();
function animateGoalRings(){const orbit=document.querySelector('.goal-orbit');if(!orbit)return;const items=goalRingMetrics(),signature=profileId+':'+items.map(item=>item.value).join(':');highlightGoalRing(null);if(enteredGoalSignatures.has(signature)||matchMedia('(prefers-reduced-motion: reduce)').matches||document.body.classList.contains('motion-paused'))return;enteredGoalSignatures.add(signature);
 orbit.querySelectorAll('.goal-ring-value').forEach((circle,index)=>{const offset=Number(circle.style.strokeDashoffset);if(offset>=100)return;circle.animate([{strokeDashoffset:100,opacity:0},{strokeDashoffset:offset,opacity:1}],{duration:900,delay:index*55,easing:'cubic-bezier(.22,1,.36,1)'});});
 const center=orbit.querySelector('[data-goal-center-value]'),total=items[0].value;if(total==null)return;const start=performance.now();function tick(now){if(!center.isConnected)return;const t=Math.min(1,(now-start)/900);center.innerHTML=fmt(Math.round(total*(1-Math.pow(1-t,3))*10)/10)+'<small>%</small>';if(t<1)goalCenterFrame=requestAnimationFrame(tick);}goalCenterFrame=requestAnimationFrame(tick);
}
document.addEventListener('pointerover',event=>{const element=event.target.closest?.('[data-ring-index]');if(element&&element.closest('.cinema-hero'))highlightGoalRing(element.dataset.ringIndex);});
document.addEventListener('pointerout',event=>{const element=event.target.closest?.('[data-ring-index]');if(element&&element.closest('.cinema-hero')&&!element.contains(event.relatedTarget))highlightGoalRing(null);});
document.addEventListener('focusin',event=>{const element=event.target.closest?.('[data-ring-index]');if(element&&element.closest('.cinema-hero'))highlightGoalRing(element.dataset.ringIndex);});
document.addEventListener('focusout',event=>{if(event.target.closest?.('[data-ring-index]'))highlightGoalRing(null);});
document.addEventListener('keydown',event=>{const element=event.target.closest?.('circle[data-ring-index]');if(element&&['Enter',' '].includes(event.key)){event.preventDefault();openGoalMetric(Number(element.dataset.ringIndex));}});
const goalRingsRouteBase=route;
route=function(){goalRingsRouteBase();animateGoalRings();};
route();
</script>
<script>

<script id="ceo-mobile-business-flow">
// Mobile workflow shares the same profiles, evidence records and task state as desktop.
const mobileViewport=matchMedia('(max-width:700px)');
let mobileInboxFilter='all',mobileRecordFilter='all';
const mobileSourceTimes={operations:'16:10',cash:'17:25',decision:'17:30',missing:'17:35',stale:'16:10',validation:'17:30'};
const mobileReadStoreKey='ceo-mobile-notice-read-v1';
const mobileReadNotices=new Set((load(mobileReadStoreKey,[])||[]).filter(value=>typeof value==='string'));
const mobileObservedNotices=new Map();
function mobileFact(id){const p=profile();if(id==='operations')return p.operationsLabel+' '+pct(rate(p.completed,p.total))+'，已完成 '+fmt(p.completed)+' / '+fmt(p.total)+' '+p.operationsUnit+'。';if(id==='cash')return '应收 '+fmt(p.receivable)+' '+p.moneyUnit+'，已到账 '+fmt(p.collected)+' '+p.moneyUnit+'，其中逾期未收 '+fmt(p.overdue)+' '+p.moneyUnit+'。';return issue(id)?.title?issue(id).title+'。':'';}
function mobileOwner(item){return (task(item.id)?.owner||item.owner)+' · '+item.department;}
function mobileEvidenceState(id){if(id==='operations')return verified('stale')?'更新依据已复核':'原始进度时点待核实';if(['missing','stale','validation'].includes(id))return verified(id)?'补充依据已复核':'待核验';return '待负责人核查';}
function mobilePriorityItems(){return deliveryAttentionItems().sort((a,b)=>Number(task(a.id)?.status==='closed')-Number(task(b.id)?.status==='closed'));}
function mobileNoticeItems(){const rows=mobilePriorityItems().map(item=>({id:item.id,title:item.title,text:mobileFact(item.id),kind:'alert',time:mobileSourceTimes[item.id],owner:mobileOwner(item)}));for(const item of issues().filter(entry=>task(entry.id)?.status==='feedback')){const entry={id:item.id,title:item.title,text:'负责人已提交处理反馈，等待你审阅并复核。',kind:'feedback',time:'待复核',owner:mobileOwner(item)};const index=rows.findIndex(row=>row.id===item.id);if(index>=0)rows[index]=entry;else rows.unshift(entry);}return rows.map(row=>({...row,key:profileId+':'+(profile().revision||'base')+':'+row.id+':'+row.kind+':'+row.text+(row.kind==='feedback'?':'+(task(row.id)?.feedback||''):'' )}));}
function mobileUpdateNoticeBadge(){if(!mobileViewport.matches)return;const unread=mobileNoticeItems().filter(item=>!mobileReadNotices.has(item.key)).length;const badge=document.querySelector('#unread-count');if(badge)badge.textContent=unread;document.querySelector('#notifications')?.setAttribute('aria-label','消息中心，'+unread+' 条未读');}
function mobileSaveRead(){save(mobileReadStoreKey,[...mobileReadNotices].slice(-200));mobileUpdateNoticeBadge();}
function mobileOpenNotice(id){const notice=mobileNoticeItems().find(item=>item.id===id);if(notice){mobileReadNotices.add(notice.key);mobileSaveRead();}document.querySelector('.mobile-notice-toast')?.remove();openIssue(id);}
function mobileMarkAllRead(){mobileNoticeItems().forEach(item=>mobileReadNotices.add(item.key));mobileSaveRead();openMobileNotifications();}
function openMobileNotifications(){const entries=mobileNoticeItems(),unread=entries.filter(item=>!mobileReadNotices.has(item.key)).length;deliveryModal('<span class="pill blue">站内提醒</span><div class="m-notice-head"><h2>消息中心</h2><button onclick="mobileMarkAllRead()">全部标为已读</button></div><p class="sub">'+unread+' 条未读 · 同一事项合并展示 · 示例经营数据</p>'+entries.map(item=>'<button class="m-notice" onclick="mobileOpenNotice(&#39;'+item.id+'&#39;)"><strong>'+(!mobileReadNotices.has(item.key)?'<i class="m-unread" aria-label="未读"></i>':'')+esc(item.title)+'</strong><small>'+esc(item.text)+'</small><small>'+esc(item.owner)+' · '+(item.kind==='feedback'?'等待复核':'依据更新 '+esc(item.time))+'</small></button>').join('')+(entries.length?'':'<div class="m-empty">当前没有重要提醒。</div>')+'<p class="m-snapshot">此处展示本地示例中的业务提醒与反馈；真实设备推送待接入。</p>','mobile-notification-dialog');}
function mobileSyncNotices(){mobileUpdateNoticeBadge();const entries=mobileNoticeItems(),before=mobileObservedNotices.get(profileId),next=new Set(entries.map(item=>item.key));mobileObservedNotices.set(profileId,next);if(!mobileViewport.matches||!before)return;const fresh=entries.find(item=>!before.has(item.key)&&!mobileReadNotices.has(item.key));if(!fresh)return;document.querySelector('.mobile-notice-toast')?.remove();const panel=document.createElement('aside');panel.className='mobile-notice-toast';panel.setAttribute('role','status');panel.innerHTML='<button onclick="mobileOpenNotice(&#39;'+fresh.id+'&#39;)"><strong>'+(fresh.kind==='feedback'?'收到处理反馈':'经营信息有更新')+'</strong><br>'+esc(fresh.title)+' →</button><button aria-label="关闭提醒" onclick="this.closest(&#39;aside&#39;).remove()">×</button>';document.body.append(panel);}
function mobileAsk(question){openAssistant();ask(question);}
function mobileOverview(){
 const p=profile(),priorities=mobilePriorityItems(),first=priorities[0],others=priorities.slice(1),report=ceoReportForCurrent(),needs=issues().filter(item=>!task(item.id)||task(item.id).status==='feedback').length;
 const desktopTemplate=document.createElement('template');desktopTemplate.innerHTML=mobileDesktopOverview();const desktopHero=desktopTemplate.content.querySelector('.cinema-hero');const rings=(desktopHero?.querySelector('.goal-orbit')?.outerHTML||'')+(desktopHero?.querySelector('.goal-legend')?.outerHTML||'');const gap=p.revenueTarget>0?Math.max(0,p.revenueTarget-p.revenue):null,quality=issues().filter(item=>item.type==='evidence'&&!verified(item.id)).length;
 const alert=first?'<article class="m-alert"><div class="m-alert-top"><span>'+'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 10 18H2L12 3ZM12 9v5m0 3v.1"/></svg>'+'重点关注 · '+esc(status(first.id))+'</span><span>更新 '+mobileSourceTimes[first.id]+'</span></div><h3>'+esc(first.title)+'</h3><p>'+esc(mobileFact(first.id))+'</p><div class="m-alert-owner">'+esc(mobileOwner(first))+' · '+esc(mobileEvidenceState(first.id))+'</div><button onclick="openIssue(&#39;'+first.id+'&#39;)">查看依据与处理 <span>→</span></button></article>':'<div class="m-empty">当前示例数据未发现业务进度或逾期回款偏离，仍可查看经营摘要与部门汇报。</div>';
 return '<div class="mobile-ceo"><div class="m-intro"><div><h1>经营总览</h1><p>'+esc(p.company)+' · 10月22日<br>汇总于 17:36 · 示例数据</p></div><select id="mobile-industry" name="mobile-industry" class="m-company-select" aria-label="选择行业视图" onchange="switchIndustry(this.value)">'+Object.entries(profiles).map(([key,item])=>'<option value="'+esc(key)+'" '+(key===profileId?'selected':'')+'>'+esc(item.label)+'</option>').join('')+'</select></div><section aria-label="重要提醒"><div class="m-section-head"><h2>重要提醒 <small>'+priorities.length+' 项关注</small></h2><button onclick="openMobileNotifications()">消息中心 →</button></div>'+alert+others.map(item=>'<button class="m-alert-secondary" onclick="openIssue(&#39;'+item.id+'&#39;)"><span><strong>'+esc(item.title)+'</strong><small>'+esc(mobileOwner(item))+' · '+esc(status(item.id))+'</small></span><span>↗</span></button>').join('')+'</section><section aria-label="事项处理"><div class="m-section-head"><h2>待我处理 <small>'+needs+' 项</small></h2><button onclick="go(&#39;alerts&#39;)">查看全部 →</button></div><div class="m-work-counts">'+[['unassigned','待交办','#a75b1e'],['assigned','跟进中','#248e82'],['feedback','待复核','#796b9b']].map(([key,label,color])=>'<button style="--queue-color:'+color+'" onclick="openWorkQueue(&#39;'+key+'&#39;)" aria-label="'+label+' '+workQueueItems(key).length+' 项"><span>'+label+'</span><strong>'+workQueueItems(key).length+'<small>项</small></strong></button>').join('')+'</div></section><section class="m-summary" aria-label="经营摘要"><div class="m-section-head"><h2>经营摘要</h2><button onclick="openMobileData()">详细数据 →</button></div><div class="cinema-hero mobile-summary-hero">'+rings+'</div><div class="m-summary-gap">'+(gap==null?'尚未配置月度收入目标。':gap>0?'距月度收入目标还差 <b>'+fmt(gap)+' '+esc(p.moneyUnit)+'</b>':'本月收入已达到目标。')+'<br>收入更新 17:20 · 业务进度 16:10 · 回款 17:25</div></section><section class="m-report"><div class="m-section-head"><h2>部门汇报</h2><small class="sub">17:36</small></div><button class="m-report-main" onclick="ceoPushPanel()"><strong>'+esc(deliveryOverviewText(report))+'</strong><span>'+esc(report.attention.map(item=>item.title).join('；')||'业务进度、经营收入与应收回款已汇总')+'</span><span class="m-link">查看汇总与原始资料 →</span></button><div class="m-quality"><span>'+quality+' 项资料待核验</span><button onclick="openQuality()">查看核验 →</button></div></section><section class="m-assistant"><div class="m-section-head"><h2>经营助理</h2><button onclick="openAssistant()">开始问询 →</button></div><p>按当前企业口径查询，可继续追问影响、依据和负责人。</p><div class="m-questions"><button onclick="mobileAsk(&#39;今天有哪些需要关注的变化？&#39;)">今天有哪些需要关注的变化？</button><button onclick="mobileAsk(&#39;回款情况如何？&#39;)">回款情况如何？</button></div></section><p class="m-snapshot">业务日期 '+esc(businessDay)+' · 跟随所选行业的数据口径<br>已确认的处理措施不等于业务指标已经恢复。</p></div>';
}
function openMobileData(kind='trend'){const p=profile();deliveryModal('<span class="pill blue">经营数据</span><h2>'+(kind==='cash'?'应收款结构':'经营收入趋势')+'</h2><p class="sub">'+esc(p.company)+' · 业务日期 '+esc(businessDay)+'</p><div class="m-tabs"><button aria-pressed="'+(kind==='trend')+'" onclick="openMobileData(&#39;trend&#39;)">收入趋势</button><button aria-pressed="'+(kind==='cash')+'" onclick="openMobileData(&#39;cash&#39;)">应收回款</button></div>'+(kind==='trend'?'<p class="sub" id="trend-average-label">'+esc(trendAverageLabel())+'</p><div class="trend-range" role="group" aria-label="收入趋势展示区间"><button data-trend-window="7" aria-pressed="'+(trendWindow===7)+'" onclick="setTrendWindow(7)">近7日</button><button data-trend-window="3" aria-pressed="'+(trendWindow===3)+'" onclick="setTrendWindow(3)">近3日</button></div><div class="cinema-trend"><div id="revenue-visual">'+trend()+'</div></div><p class="m-detail-meta">每日收入是月度累计的一部分，收入与实际回款为不同口径。收入依据更新 17:20。</p>':'<div class="cash-visual">'+cashChart()+'</div><p class="m-detail-meta">逾期未收包含在尚未到账金额内。回款依据更新 17:25。</p>')+'<div class="m-issue-actions"><button onclick="sourceDocument(&#39;'+(kind==='trend'?'revenue':'cash')+'&#39;)">查看原始依据</button><button onclick="document.querySelector(&#39;#detail&#39;).close()">返回首页</button></div>','mobile-data-dialog');document.querySelector('#detail').dataset.mobileDataKind=kind;}
const mobileDesktopOverview=overview;
overview=function(){return mobileViewport.matches?mobileOverview():mobileDesktopOverview();};
const mobileDesktopIssue=openIssue;
openIssue=function(id){if(!mobileViewport.matches)return mobileDesktopIssue(id);const item=issue(id);if(!item)return;const assigned=task(id);if(id==='operations'&&workspaceFlow.active)workspaceFlow.seen=true;modal('<span class="pill blue">'+esc(item.department)+'</span> '+badge(id)+'<h2>'+esc(item.title)+'</h2><section class="m-detail-fact"><h3>发生了什么</h3><p>'+esc(mobileFact(id))+'</p></section><section class="m-detail-fact"><h3>影响什么</h3><p>'+esc(item.impact)+'</p></section><section class="m-detail-fact"><h3>依据是什么</h3><p>'+esc(item.sourceId)+'</p><div class="m-detail-meta">业务日期 '+esc(businessDay)+' · 资料更新 '+mobileSourceTimes[id]+'<br>'+esc(mobileEvidenceState(id))+'</div><button onclick="mobileViewEvidence(&#39;'+id+'&#39;,&#39;'+item.source+'&#39;)">核对原始依据 →</button>'+(id==='operations'?'<button onclick="mobileViewEvidence(&#39;operations&#39;,&#39;validation&#39;)">核对初稿差异</button>':'')+'</section><section class="m-detail-fact"><h3>谁在跟进</h3><p>'+esc(mobileOwner(item))+'</p><div class="m-detail-meta">'+(assigned?'截止 '+esc(assigned.due.replace('T',' '))+' · '+esc(status(id)):'当前为建议负责人，交办后明确截止时间。')+'</div></section><div class="m-issue-actions"><button onclick="document.querySelector(&#39;#detail&#39;).close()">返回工作台</button><button class="primary" onclick="'+(assigned?'taskRecord':'assign')+'(&#39;'+id+'&#39;)">'+(assigned?.status==='feedback'?'审阅处理反馈':assigned?'查看处理进展':'交办负责人')+' →</button></div>','mobile-issue-dialog');if(workspaceFlow.active)updateFlowHelp();};
function mobileViewEvidence(id,key){sourceDocument(key);document.querySelectorAll('#dialog-content .source-return,#dialog-content .mobile-evidence-return').forEach(element=>element.remove());const back=document.createElement('button');back.className='mobile-evidence-return';back.textContent='← 返回事项详情';back.onclick=()=>openIssue(id);document.querySelector('#dialog-content').append(back);}
const mobileDesktopSource=sourceDocument;
sourceDocument=function(key){const dialog=document.querySelector('#detail'),fromChat=mobileViewport.matches&&dialog.open&&dialog.classList.contains('home-assistant-dialog'),fromData=mobileViewport.matches&&dialog.open&&dialog.classList.contains('mobile-data-dialog'),dataKind=dialog.dataset.mobileDataKind;mobileDesktopSource(key);if(!fromChat&&!fromData)return;const back=document.createElement('button');back.className='mobile-evidence-return';back.textContent=fromChat?'← 返回经营助理':'← 返回经营数据';back.onclick=()=>fromChat?openAssistant():openMobileData(dataKind);document.querySelector('#dialog-content').append(back);};
function mobileInboxItems(){return issues().filter(item=>!task(item.id)||task(item.id).status==='feedback').filter(item=>mobileInboxFilter==='all'||mobileInboxFilter==='unassigned'&&!task(item.id)||mobileInboxFilter==='feedback'&&task(item.id)?.status==='feedback'||mobileInboxFilter==='evidence'&&item.type==='evidence').sort((a,b)=>Number(task(b.id)?.status==='feedback')-Number(task(a.id)?.status==='feedback'));}
function mobileTaskCard(item,record=false){const current=task(item.id);return '<article class="m-item"><div class="m-item-top"><span>'+esc(item.department)+'</span>'+badge(item.id)+'</div><h2>'+esc(item.title)+'</h2><p>'+esc(mobileOwner(item))+(current?'<br>截止 '+esc(current.due.replace('T',' ')):'<br>'+esc(item.type==='evidence'?'资料依据待核验':mobileFact(item.id)))+'</p><button onclick="'+(record?'taskRecord':'openIssue')+'(&#39;'+item.id+'&#39;)">'+(current?.status==='feedback'?'审阅反馈':record?'查看跟进记录':'查看依据与处理')+'<span>→</span></button></article>';}
function setMobileInboxFilter(value){if(!['all','unassigned','feedback','evidence'].includes(value))return;mobileInboxFilter=value;route();}
function setMobileRecordFilter(value){if(!['all','assigned','feedback','closed'].includes(value))return;mobileRecordFilter=value;route();}
const mobileDesktopAlerts=alerts;
alerts=function(){if(!mobileViewport.matches)return mobileDesktopAlerts();const items=mobileInboxItems();return '<div class="mobile-work-page"><div><h1>待我处理</h1><p class="sub">查看依据后交办，收到反馈后复核。</p></div><div class="m-tabs" role="group" aria-label="筛选待处理事项">'+[['all','全部'],['unassigned','待交办'],['feedback','待复核'],['evidence','资料核验']].map(([key,label])=>'<button aria-pressed="'+(mobileInboxFilter===key)+'" onclick="setMobileInboxFilter(&#39;'+key+'&#39;)">'+label+'</button>').join('')+'</div>'+items.map(item=>mobileTaskCard(item)).join('')+(items.length?'':'<div class="m-empty">当前分类没有需要处理的事项，可到跟进记录查看已交办任务。</div>')+'</div>';};
const mobileDesktopTasks=taskPage;
taskPage=function(){if(!mobileViewport.matches)return mobileDesktopTasks();const items=issues().filter(item=>task(item.id)&&(mobileRecordFilter==='all'||task(item.id).status===mobileRecordFilter));return '<div class="mobile-work-page"><div><h1>跟进记录</h1><p class="sub">负责人、截止时间、反馈和复核记录。</p></div><div class="m-tabs" role="group" aria-label="筛选跟进记录">'+[['all','全部'],['assigned','跟进中'],['feedback','待复核'],['closed','已完成']].map(([key,label])=>'<button aria-pressed="'+(mobileRecordFilter===key)+'" onclick="setMobileRecordFilter(&#39;'+key+'&#39;)">'+label+'</button>').join('')+'</div>'+items.map(item=>mobileTaskCard(item,true)).join('')+(items.length?'':'<div class="m-empty">当前分类没有跟进记录。先从待我处理打开事项并交办负责人。</div>')+'</div>';};
const mobileDesktopNotifications=openNotifications;
openNotifications=function(){return mobileViewport.matches?openMobileNotifications():mobileDesktopNotifications();};
const mobileDeliveryUpdateBadge=deliveryUpdateBadge;
deliveryUpdateBadge=function(){mobileDeliveryUpdateBadge();mobileUpdateNoticeBadge();};
const mobileBusinessRoute=route;
route=function(){mobileBusinessRoute();mobileSyncNotices();};
let mobileBreakpointPending=false;
mobileViewport.addEventListener('change',()=>{document.querySelector('.mobile-notice-toast')?.remove();if(document.querySelector('#detail').open){mobileBreakpointPending=true;return;}route();});
document.querySelector('#detail').addEventListener('close',()=>{if(mobileBreakpointPending){mobileBreakpointPending=false;route();}});
route();
</script>
<script id="ceo-workspace-heading-layout">
function arrangeWorkspaceHeading(){
 const shell=document.querySelector('.shell'),header=shell.querySelector('header'),main=document.querySelector('#main'),identity=document.querySelector('.workspace-identity');
 if(!identity)return;
 let heading=shell.querySelector('.workspace-masthead');
 if(matchMedia('(max-width:700px)').matches){header.prepend(identity);heading?.remove();return;}
 const controls=main.querySelector('.cinema-controls');
 if(!heading){heading=document.createElement('div');heading.className='workspace-masthead';shell.insertBefore(heading,main);}
 heading.replaceChildren(identity);
 if(controls)heading.append(controls);
 main.querySelector('.cinema-top')?.remove();
}
const workspaceHeadingRoute=route;
route=function(){document.querySelector('.workspace-masthead .cinema-controls')?.remove();workspaceHeadingRoute();arrangeWorkspaceHeading();};
arrangeWorkspaceHeading();
</script>
